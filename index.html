<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light">
<title>ANOX — ניהול ביצועי שחקנים</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2316a34a'/%3E%3Ctext x='16' y='23' font-family='Arial' font-weight='700' font-size='19' fill='white' text-anchor='middle'%3EA%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- Login screen (account mode) -->
<section id="login-screen" class="login" hidden>
  <form id="login-form" class="login__card" autocomplete="on">
    <div class="brand brand--dark"><span class="brand__mark">A</span><span class="brand__name">ANOX</span></div>
    <h1 class="login__title">כניסה לחשבון</h1>
    <p class="login__sub">מנהלי קבוצות ומנהל הפלטפורמה</p>
    <label class="field"><span>אימייל</span><input type="email" name="email" required autocomplete="username"></label>
    <label class="field"><span>סיסמה</span><input type="password" name="password" required autocomplete="current-password"></label>
    <p class="form-error" id="login-error" role="alert"></p>
    <button class="btn btn--primary btn--block" type="submit">כניסה</button>
    <button class="btn btn--ghost btn--block" type="button" data-action="enter-demo">צפייה בהדגמה ללא התחברות</button>
  </form>
</section>

<!-- Application shell -->
<div id="app" class="shell" hidden>
  <aside class="sidebar" id="sidebar">
    <div class="brand"><span class="brand__mark">A</span><span class="brand__name">ANOX</span></div>
    <nav class="nav" id="nav">
      <a href="#overview" data-route="overview">סקירת קבוצה</a>
      <a href="#roster" data-route="roster">סגל שחקנים</a>
      <a href="#activities" data-route="activities">אימונים ומשחקים</a>
      <a href="#compare" data-route="compare">השוואת שחקנים</a>
      <a href="#import" data-route="import">ייבוא וייצוא</a>
      <a href="#devices" data-route="devices">מכשירים</a>
      <a href="#admin" data-route="admin" data-owner-only>ניהול הפלטפורמה</a>
      <a href="#account" data-route="account" data-account-only>החשבון שלי</a>
    </nav>
    <div class="sidebar__foot" id="sidebar-foot"></div>
  </aside>
  <div class="scrim" data-action="close-nav"></div>

  <div class="main">
    <header class="topbar">
      <button class="icon-btn topbar__menu" data-action="toggle-nav" aria-label="תפריט">&#9776;</button>
      <div class="topbar__team">
        <label class="sr-only" for="team-select">קבוצה</label>
        <select id="team-select"></select>
        <span class="team-name" id="team-name"></span>
      </div>
      <div class="topbar__period">
        <label class="sr-only" for="period-select">תקופה</label>
        <select id="period-select">
          <option value="7">7 ימים אחרונים</option>
          <option value="30" selected>30 ימים אחרונים</option>
          <option value="90">90 ימים אחרונים</option>
          <option value="all">כל התקופה</option>
        </select>
      </div>
      <div class="topbar__user" id="topbar-user"></div>
    </header>
    <div id="mode-banner" class="mode-banner" hidden></div>
    <main id="view" class="view" tabindex="-1"></main>
  </div>
</div>

<dialog id="dialog" class="dialog">
  <form method="dialog" id="dialog-form" class="dialog__form">
    <header class="dialog__head"><h2 id="dialog-title"></h2><button class="icon-btn" value="cancel" formnovalidate aria-label="סגירה">&times;</button></header>
    <div id="dialog-body" class="dialog__body"></div>
    <p class="form-error" id="dialog-error" role="alert"></p>
    <footer class="dialog__foot">
      <button class="btn btn--ghost" value="cancel" formnovalidate>ביטול</button>
      <button class="btn btn--primary" value="ok" id="dialog-ok">שמירה</button>
    </footer>
  </form>
</dialog>

<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script src="demo.js"></script>
<script src="app.js"></script>
</body>
</html>
